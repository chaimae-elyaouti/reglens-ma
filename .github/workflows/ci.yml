name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Pas de sentence-transformers ici : les tests utilisent un faux embedder (rapide, sans réseau).
      - run: pip install -e ".[api,dev]"
      - run: ruff check src tests eval scripts
      - run: pytest -q
      - run: pip-audit || true   # audit des dépendances (informatif)

  docker-build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: reglens-api:latest